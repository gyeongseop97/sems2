name: Apply holiday red-date patch

on:
  push:
    paths:
      - '.holiday-red-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mark holiday dates red
        run: node scripts/red-holiday-date.mjs
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mark Korean holiday dates red"
            git push
          fi
