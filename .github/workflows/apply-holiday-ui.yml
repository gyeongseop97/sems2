name: Apply holiday UI patch

on:
  push:
    paths:
      - '.holiday-ui-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch SEMS2 holiday display
        run: node scripts/patch-holiday-ui.mjs
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show Korean holidays on ESG due dates"
            git push
          fi
