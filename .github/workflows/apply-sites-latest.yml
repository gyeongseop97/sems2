name: Apply Sites latest to GitHub

# One-time synchronization trigger with idempotent cleanup and Vercel-equivalent validation
on:
  push:
    paths:
      - ".github/workflows/apply-sites-latest.yml"
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Apply latest Sites changes and normalize source
        shell: bash
        run: |
          set +e
          python3 scripts/sync-sites-latest.py > sites-sync.log 2>&1
          PATCH_EXIT=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PATCH_EXIT" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              git add sites-sync.log
              git commit -m "Record Sites sync failure"
              git push
            fi
            cat sites-sync.log
            exit "$PATCH_EXIT"
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text(encoding="utf-8")
          anchor = text.index("const standardMetricIndicators")
          start = text.index("type MetricTemplateField = {", anchor)
          function_start = text.index("function MetricCollection(", start)
          second = text.find("type MetricTemplateField = {", start + 1, function_start)
          if second >= 0:
              canonical = text[start:second].rstrip()
              text = text[:start] + canonical + "\n\n" + text[function_start:]
              path.write_text(text, encoding="utf-8")
              print("Removed duplicate metric template definitions.")
          else:
              print("Metric template definitions are already singular.")
          PY

          rm -f sites-sync.log sites-validation.log
          git add -A -- app/page.tsx app/globals.css tests/rendered-html.test.mjs sites-validation.log
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          elif [ "${{ github.event_name }}" = "push" ]; then
            git commit -m "Sync latest Sites version"
            git push
          else
            echo "PR validation found uncommitted synchronization differences:"
            git diff --cached
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate Sites and Vercel builds
        shell: bash
        run: |
          set +e
          {
            npm test
            npm run build:vercel
          } > sites-validation.log 2>&1
          TEST_EXIT=$?
          set -e

          cat sites-validation.log
          if [ "$TEST_EXIT" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              git pull --rebase
              git add sites-validation.log
              git commit -m "Record Sites validation failure"
              git push
            fi
            exit "$TEST_EXIT"
          fi

          rm -f sites-validation.log
          echo "Sites synchronization and Vercel validation passed."
