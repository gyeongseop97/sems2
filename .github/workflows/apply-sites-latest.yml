name: Apply Sites latest to GitHub

# One-time synchronization trigger with committed diagnostics
on:
  push:
    paths:
      - ".github/workflows/apply-sites-latest.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Apply and commit latest Sites changes
        shell: bash
        run: |
          set +e
          python3 scripts/sync-sites-latest.py > sites-sync.log 2>&1
          PATCH_EXIT=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PATCH_EXIT" -ne 0 ]; then
            git add sites-sync.log
            git commit -m "Record Sites sync failure"
            git push
            cat sites-sync.log
            exit "$PATCH_EXIT"
          fi

          rm -f sites-sync.log
          git add app/page.tsx app/globals.css tests/rendered-html.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Sync latest Sites version"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate build and rendered workflow
        shell: bash
        run: |
          set +e
          npm test > sites-validation.log 2>&1
          TEST_EXIT=$?
          set -e

          if [ "$TEST_EXIT" -ne 0 ]; then
            git pull --rebase
            git add sites-validation.log
            git commit -m "Record Sites validation failure"
            git push
            cat sites-validation.log
            exit "$TEST_EXIT"
          fi

          rm -f sites-validation.log
          echo "Sites synchronization validation passed."
