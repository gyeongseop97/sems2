name: Apply Sites latest to GitHub

# One-time synchronization trigger
on:
  push:
    paths:
      - ".github/workflows/apply-sites-latest.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Apply latest Sites changes
        run: python3 scripts/sync-sites-latest.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build and rendered workflow
        run: npm test

      - name: Commit synchronized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css tests/rendered-html.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sync latest Sites version"
          git push
