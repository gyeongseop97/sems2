name: Validate Vercel build

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/apply-vercel-fix.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint and Sites tests
        run: |
          npm run lint
          npm test
      - name: Run Vercel-equivalent build
        run: npm run build:vercel
