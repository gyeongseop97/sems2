name: Apply Vercel source repair

on:
  push:
    paths:
      - ".github/workflows/apply-vercel-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/sites-latest-validation
          fetch-depth: 0
      - name: Restore active components and comment boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("app/page.tsx")
          text = path.read_text(encoding="utf-8")

          old_report = 'const savedReports = localStorage.getItem("sems2-reports"); if (savedReports) setReports(normalizeReportDefaults(JSON.parse(savedReports) as SustainabilityReport[]));'
          new_report = 'const savedReports = localStorage.getItem("sems2-reports"); if (savedReports) setReports(JSON.parse(savedReports) as SustainabilityReport[]);'
          text = text.replace(old_report, new_report, 1)

          plan_pos = text.index("function PlanForm(")
          legacy_start = text.index("\n/*\nfunction Evidence(", plan_pos)
          indicator_marker = "function IndicatorForm({item,onClose,onSave,onDelete}"
          indicator_pos = text.index(indicator_marker, legacy_start)
          active_evidence_marker = "function Evidence({items,onChange,showToast}"

          segment = text[legacy_start:indicator_pos]
          if "\n*/\n\n" + active_evidence_marker not in segment:
              historical = subprocess.check_output(
                  ["git", "show", "668f094c469334c52d4e1895b86934543b4cc582:app/page.tsx"],
                  text=True,
              )
              historical_plan = historical.index("function PlanForm(")
              historical_close = historical.index("\n*/", historical_plan)
              historical_evidence = historical.index(active_evidence_marker, historical_close)
              historical_indicator = historical.index(indicator_marker, historical_evidence)
              restored = historical[historical_evidence:historical_indicator].rstrip()
              text = text[:indicator_pos] + "*/\n\n" + restored + "\n\n" + text[indicator_pos:]

          settings_legacy = text.index("\n/*\nfunction OrganizationSettings(", text.index("function Settings("))
          active_settings_marker = "function OrganizationSettings({organizations}:{organizations:Record<string,string[]>;onChange:"
          active_settings = text.index(active_settings_marker, settings_legacy)
          settings_segment = text[settings_legacy:active_settings]
          if "\n*/\n\n" not in settings_segment:
              text = text[:active_settings] + "*/\n\n" + text[active_settings:]

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No source repair needed."
          else
            git commit -m "Close legacy settings comment for Vercel build"
            git push origin HEAD:diagnostics/sites-latest-validation
          fi
